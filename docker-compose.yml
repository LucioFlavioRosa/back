# A pilha de desenvolvimento — os serviços Azure do desenho, em imagem local.
#
#   Azure Database for PostgreSQL  ->  postgres:16-alpine
#   Azure Service Bus              ->  emulador oficial (+ SQL Edge, que ele exige)
#   Azure Blob Storage             ->  Azurite (emulador oficial)
#   Azure Cache for Redis          ->  redis:7-alpine
#
# Entra ID fica de fora: não existe emulador, e falsificar um provedor de
# identidade em desenvolvimento é como se aceita token forjado em produção.
# `ENTRA_TENANT_ID` vazio deixa o serviço explicitamente sem auth, e o `/readyz`
# denuncia.
#
#   docker compose up -d
#   docker compose exec -T db psql -U otim -d otimizador < <ddl_input.sql>
#   docker compose exec -T db psql -U otim -d otimizador < <ddl_otimizador.sql>
#   docker compose exec -T db psql -U otim -d otimizador < migracoes/001_override.sql
#   docker compose exec -T db psql -U otim -d otimizador < dev/seed.sql
#
# Os dois DDLs vivem nos outros repositórios e não são copiados para cá de
# propósito: cópia envelhece. Caminhos no README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otim
      POSTGRES_PASSWORD: otim
      POSTGRES_DB: otimizador
    ports:
      - "55432:5432" # 55432 para não brigar com um Postgres local na 5432
    volumes:
      # Volume NOMEADO, e não anônimo. Sem esta linha o Postgres também guarda o
      # dado num volume — mas num de nome sorteado, que ninguém reconhece: um
      # `up` que decida recriar o container o abandona, e um `docker volume prune`
      # de rotina o apaga junto com o resto do lixo. Aconteceu, e a volta foi
      # restaurar dump.
      #
      # Com nome, o volume sobrevive a `up`, a `down` e ao prune, e some só com
      # `docker compose down -v` — que é explícito, e é o que se quer quando de
      # fato se quer começar do zero.
      - db-dados:/var/lib/postgresql/data
    healthcheck:
      # `-d otimizador` NÃO é redundante: sem ele o `pg_isready` usa o nome do
      # USUÁRIO como nome do banco, tenta abrir "otim", e o Postgres registra
      # `FATAL: database "otim" does not exist` — a cada 5 segundos, para sempre.
      #
      # O healthcheck continuava passando (o servidor RESPONDEU, que é o que ele
      # mede), então o defeito não era o teste: era o log, que ficava ilegível e
      # escondia erro de verdade no meio de milhares de FATAL inofensivos.
      test: ["CMD-SHELL", "pg_isready -U otim -d otimizador"]
      interval: 5s
      retries: 10

  # O emulador do Service Bus guarda estado num SQL Server — é exigência dele,
  # não escolha nossa.
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Emulador!2026"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      retries: 5

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Emulador!2026"
    volumes:
      # Declara a fila `otimizacoes` — a mesma de `config.fila_simulacoes`.
      # O emulador não cria fila sob demanda: sem esta declaração, o `send`
      # falha com "entity not found", que é o mesmo que produção faria.
      - ./dev/servicebus.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000" # blob

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-dados:
