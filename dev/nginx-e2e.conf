# SOMENTE E2E LOCAL. Copia do `deploy/nginx.conf` do front com o bloco /api
# LIGADO, apontando para o servico `api` do compose.
#
# Em producao esse bloco fica desligado de proposito: quem roteia /api e o
# Ingress, para o front e a API compartilharem origem sem o nginx do pod virar
# mais um salto. Aqui nao ha Ingress, entao o proprio nginx faz o papel dele.

# Servidor do frontend do Cadastro. Vai para /etc/nginx/conf.d/default.conf.
#
# Três coisas aqui não são opcionais e quebram o app se saírem:
#   1. o try_files da location / (sem ele, F5 em /unidade/x/cts dá 404);
#   2. o no-store em /config.js (senão o navegador serve a config do ambiente antigo);
#   3. o no-store em /index.html (senão ele aponta para um bundle que já não existe).
# Ver deploy/README.md antes de mexer.

server {
    # 8080 porque a imagem roda sem root (nginx-unprivileged); porta <1024 exigiria root.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Não anunciar a versão do nginx.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança. A CSP é permissiva com estilo inline porque o app
    # usa style={{...}} do React em vários lugares (chips, barras, larguras).
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "DENY"           always;
    add_header Referrer-Policy        "same-origin"    always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Probe de liveness/readiness do Kubernetes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Config de runtime: muda por ambiente, então nunca pode ficar em cache.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Bundle com hash no nome: imutável, cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # É o index que aponta para o bundle novo a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # History fallback do SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── /api ──────────────────────────────────────────────────────────────────
    # Normalmente o Ingress roteia /api direto para o Service do backend e este
    # bloco fica desligado. Ligue-o só se o roteamento for feito aqui dentro;
    # nesse caso troque o host pelo Service do backend no cluster.
    #
    location /api/ {
        proxy_pass         http://api:8000;   # SEM barra final: o backend monta as rotas em /api, entao o caminho tem de chegar inteiro
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;  # não engolir o Bearer
    }

}
